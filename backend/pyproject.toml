[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "korriente-agentes"
version = "0.1.0"
description = "Fabrica de agentes de IA para PyMEs chilenas (Korriente)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Providers reales (opcionales): se instalan solo si se usan.
openai = ["openai>=1.30"]
anthropic = ["anthropic>=0.25"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
